[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-ai-battle"
version = "0.1.0"
description = "Local development and evaluation harness for the PTCG AI Battle Challenge"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.14.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["agent", "simulator"]
